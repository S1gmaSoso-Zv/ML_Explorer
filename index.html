<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ML-English Explorer</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel для поддержки JSX прямо в браузере -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { 
      background-color: #0f172a; 
      color: #e2e8f0; 
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    /* Кастомные классы для 3D анимации карточек */
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { -webkit-backface-visibility: hidden; backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
    
    /* Анимация появления */
    .fade-in { animation: fadeIn 0.5s ease-out forwards; }
    @keyframes fadeIn { 
      from { opacity: 0; transform: translateY(10px); } 
      to { opacity: 1; transform: translateY(0); } 
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, Fragment } = React;

    // --- ИКОНКИ (SVG компоненты для работы без внешних библиотек) ---
    const IconLayoutDashboard = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>;
    const IconBrainCircuit = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M9 13a4.5 4.5 0 0 0 3-4"/><path d="M6.003 5.125A3 3 0 0 0 6.401 6.5"/><path d="M3.477 10.896a4 4 0 0 1 .585-.396"/><path d="M6 18a4 4 0 0 1-1.967-.516"/><path d="M12 13h4"/><path d="M12 18h6a2 2 0 0 1 2 2v1"/><path d="M12 8h8"/><path d="M16 8V5a2 2 0 0 1 2-2"/><circle cx="16" cy="13" r=".5"/><circle cx="18" cy="3" r=".5"/><circle cx="20" cy="21" r=".5"/><circle cx="20" cy="8" r=".5"/></svg>;
    const IconTarget = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>;
    const IconFileText = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg>;
    const IconLibrary = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/></svg>;
    const IconSearch = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>;
    const IconCheck = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 6 9 17l-5-5"/></svg>;
    const IconX = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>;
    const IconRotateCcw = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>;
    const IconBookOpen = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>;
    const IconInfo = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>;

    // --- ДАННЫЕ ДЛЯ ТРЕНАЖЕРА ---
    const WORDS = [
      { id: 1, term: "Feature", translation: "Признак", category: "Данные", context: "В ML это измеримое свойство или характеристика наблюдаемого явления.", codeExample: "X_features = df.drop('target', axis=1)" },
      { id: 2, term: "Training", translation: "Обучение", category: "Процессы", context: "Процесс алгоритмического подбора оптимальных весов модели.", codeExample: "model.fit(X_train, y_train)" },
      { id: 3, term: "Loss Function", translation: "Функция потерь", category: "Метрики", context: "Оценивает, насколько предсказанное значение отклоняется от реального.", codeExample: "loss = criterion(outputs, labels)" },
      { id: 4, term: "Epoch", translation: "Эпоха", category: "Метрики", context: "Один полный проход алгоритма обучения по всему тренировочному датасету.", codeExample: "for epoch in range(num_epochs):" },
      { id: 5, term: "Tensor", translation: "Тензор", category: "Данные", context: "Многомерный массив, базовая структура данных в нейросетях.", codeExample: "x = torch.tensor([1, 2, 3])" }
    ];

    const QUIZ_QUESTIONS = [
      {
        id: 1,
        sentence: "Производительность модели значительно улучшилась после того, как мы сконструировали новый _____.",
        options: ["Loss Function", "Feature", "Epoch", "Tensor"],
        correct: "Feature",
        explanation: 'Ошибка: В данном контексте "feature" означает "признак", который можно сконструировать (feature engineering).'
      },
      {
        id: 2,
        sentence: "Мы проходим по всему датасету несколько _____ для минимизации ошибки.",
        options: ["Feature", "Training", "Epoch", "Tensor"],
        correct: "Epoch",
        explanation: 'Ошибка: Полный проход по датасету в цикле называется "Epoch" (Эпоха).'
      }
    ];

    // --- КОМПОНЕНТЫ ИНТЕРФЕЙСА ---

    const GlassCard = ({ children, className = "" }) => (
      <div className={`bg-slate-800/40 backdrop-blur-md border border-slate-700/50 rounded-3xl shadow-lg ${className}`}>
        {children}
      </div>
    );

    // 1. ГЛАВНАЯ ПАНЕЛЬ
    const Dashboard = () => {
      return (
        <div className="space-y-6 fade-in">
          <h1 className="text-3xl font-bold text-white mb-2">С возвращением, Разработчик! 👋</h1>
          <p className="text-slate-400 mb-8">Твой прогресс в изучении технического английского.</p>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <GlassCard className="p-6">
              <div className="flex items-center justify-between">
                <div>
                  <h3 className="text-slate-300 text-sm font-medium">Изучено терминов</h3>
                  <p className="text-4xl font-bold text-blue-400 mt-2">12 / 50</p>
                </div>
                <div className="h-16 w-16 rounded-full border-4 border-blue-400/20 flex items-center justify-center border-t-blue-400">
                  <span className="text-blue-400 font-bold">24%</span>
                </div>
              </div>
            </GlassCard>

            <GlassCard className="p-6">
              <div className="flex items-center justify-between">
                <div>
                  <h3 className="text-slate-300 text-sm font-medium">Пройдено тестов</h3>
                  <p className="text-4xl font-bold text-purple-500 mt-2">5</p>
                </div>
                <div className="bg-purple-500/20 p-4 rounded-full">
                  <IconTarget className="w-8 h-8 text-purple-500" />
                </div>
              </div>
            </GlassCard>
          </div>

          <h2 className="text-2xl font-bold text-white mt-10 mb-4">Доступные модули</h2>
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {['Основы машинного обучения', 'Глубокие нейронные сети', 'Обработка текста и CV'].map((course, idx) => (
              <GlassCard key={idx} className="p-5 cursor-pointer hover:bg-slate-700/40 transition-all hover:scale-105 duration-300">
                <IconBookOpen className={`w-8 h-8 mb-4 ${idx === 0 ? 'text-blue-400' : 'text-slate-500'}`} />
                <h3 className="text-lg font-semibold text-white">{course}</h3>
                <p className="text-sm text-slate-400 mt-1">{idx === 0 ? 'В процессе изучения' : 'Модуль заблокирован'}</p>
              </GlassCard>
            ))}
          </div>
        </div>
      );
    };

    // 2. ИНТЕРАКТИВНЫЙ ТРЕНАЖЕР
    const PracticeZone = () => {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);
      const word = WORDS[currentIndex];

      const nextCard = () => {
        setIsFlipped(false);
        setTimeout(() => {
          setCurrentIndex((prev) => (prev + 1) % WORDS.length);
        }, 150);
      };

      return (
        <div className="max-w-2xl mx-auto flex flex-col items-center fade-in">
          <h2 className="text-2xl font-bold text-white mb-8">Интерактивный тренажёр</h2>
          
          <div className="w-full aspect-[4/3] sm:aspect-video perspective-1000 cursor-pointer" onClick={() => setIsFlipped(!isFlipped)}>
            <div className={`relative w-full h-full transition-transform duration-700 transform-style-3d ${isFlipped ? 'rotate-y-180' : ''}`}>
              
              {/* Лицевая сторона */}
              <GlassCard className="absolute w-full h-full flex flex-col items-center justify-center backface-hidden">
                <span className="text-sm font-medium text-blue-400 tracking-wider uppercase mb-4">{word.category}</span>
                <h3 className="text-5xl font-bold text-white mb-2">{word.term}</h3>
                <p className="text-slate-400 flex items-center gap-2"><IconRotateCcw className="w-4 h-4"/> Нажми, чтобы перевернуть</p>
              </GlassCard>

              {/* Обратная сторона */}
              <GlassCard className="absolute w-full h-full flex flex-col items-center justify-center backface-hidden rotate-y-180 bg-slate-800/80">
                <h3 className="text-4xl font-bold text-purple-400 mb-2">{word.translation}</h3>
                <p className="text-slate-300 mb-6 text-center px-6">{word.context}</p>
                <div className="bg-slate-950 p-4 rounded-xl w-3/4 max-w-md border border-slate-800">
                  <code className="text-green-400 font-mono text-sm">{word.codeExample}</code>
                </div>
              </GlassCard>
              
            </div>
          </div>

          <div className="flex gap-4 mt-8 w-full justify-center">
            <button onClick={nextCard} className="flex-1 max-w-[160px] py-3 rounded-2xl bg-red-500/10 text-red-400 border border-red-500/20 hover:bg-red-500/20 transition-colors flex items-center justify-center gap-2">
              <IconX className="w-5 h-5" /> Не помню
            </button>
            <button onClick={nextCard} className="flex-1 max-w-[160px] py-3 rounded-2xl bg-slate-700/30 text-white border border-slate-600/50 hover:bg-slate-700/50 transition-colors">
              Повторить
            </button>
            <button onClick={nextCard} className="flex-1 max-w-[160px] py-3 rounded-2xl bg-green-500/10 text-green-400 border border-green-500/20 hover:bg-green-500/20 transition-colors flex items-center justify-center gap-2">
              <IconCheck className="w-5 h-5" /> Знаю
            </button>
          </div>
        </div>
      );
    };

    // 3. АНАЛИЗ КОНТЕКСТА
    const ContextQuiz = () => {
      const [currentQ, setCurrentQ] = useState(0);
      const [selected, setSelected] = useState(null);
      const [toast, setToast] = useState(null);

      const question = QUIZ_QUESTIONS[currentQ];

      const handleAnswer = (option) => {
        setSelected(option);
        if (option === question.correct) {
          setToast({ type: 'success', msg: 'Абсолютно верно! Отличная работа.' });
          setTimeout(() => {
            setSelected(null);
            setToast(null);
            setCurrentQ((prev) => (prev + 1) % QUIZ_QUESTIONS.length);
          }, 2000);
        } else {
          setToast({ type: 'error', msg: question.explanation });
        }
      };

      return (
        <div className="max-w-3xl mx-auto fade-in">
          <h2 className="text-2xl font-bold text-white mb-8">Контекстный анализ</h2>
          
          <GlassCard className="p-8">
            <div className="mb-8">
              <span className="text-blue-400 font-mono text-sm mb-2 block">Вопрос {currentQ + 1} из {QUIZ_QUESTIONS.length}</span>
              <p className="text-xl text-white leading-relaxed">
                {question.sentence.split('_____').map((part, i, arr) => (
                  <Fragment key={i}>
                    {part}
                    {i < arr.length - 1 && (
                      <span className="inline-block border-b-2 border-slate-500 w-24 mx-2 text-center text-purple-400">
                        {selected || "..."}
                      </span>
                    )}
                  </Fragment>
                ))}
              </p>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              {question.options.map((opt) => (
                <button
                  key={opt}
                  onClick={() => handleAnswer(opt)}
                  disabled={toast?.type === 'success'}
                  className={`p-4 rounded-2xl border transition-all duration-300 text-left font-medium
                    ${selected === opt 
                      ? (opt === question.correct 
                          ? 'bg-green-500/20 border-green-500/50 text-green-300' 
                          : 'bg-red-500/20 border-red-500/50 text-red-300')
                      : 'bg-slate-800/50 border-slate-700 hover:bg-slate-700/80 text-slate-200'
                    }`}
                >
                  {opt}
                </button>
              ))}
            </div>
          </GlassCard>

          {toast && (
            <div className={`mt-6 p-4 rounded-2xl flex items-start gap-3 shadow-xl fade-in ${toast.type === 'error' ? 'bg-red-900/40 border border-red-500/30' : 'bg-green-900/40 border border-green-500/30'}`}>
              {toast.type === 'error' ? <IconInfo className="text-red-400 shrink-0 w-6 h-6" /> : <IconCheck className="text-green-400 shrink-0 w-6 h-6" />}
              <p className={`text-sm mt-0.5 ${toast.type === 'error' ? 'text-red-200' : 'text-green-200'}`}>{toast.msg}</p>
            </div>
          )}
        </div>
      );
    };

    // 4. ИНТЕРАКТИВНОЕ ЧТЕНИЕ
    const ReadingZone = () => {
      const HighlightedTerm = ({ term, translation, code }) => (
        <span className="relative group inline-block cursor-help">
          <span className="text-blue-400 border-b border-blue-400/50 border-dashed">{term}</span>
          <div className="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 w-64 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-300 z-10 translate-y-2 group-hover:translate-y-0">
            <GlassCard className="p-3 text-sm">
              <p className="font-bold text-white mb-1">{translation}</p>
              <div className="bg-slate-900 p-2 rounded-lg font-mono text-xs text-green-400 overflow-x-auto">
                {code}
              </div>
            </GlassCard>
            <div className="absolute top-full left-1/2 -translate-x-1/2 border-4 border-transparent border-t-slate-700/50"></div>
          </div>
        </span>
      );

      return (
        <div className="max-w-3xl mx-auto fade-in">
          <h2 className="text-2xl font-bold text-white mb-8">Чтение документации</h2>
          
          <GlassCard className="p-8">
            <div className="flex items-center gap-2 mb-6 border-b border-slate-700/50 pb-4">
              <IconFileText className="text-purple-400 w-6 h-6" />
              <h3 className="text-lg font-mono text-slate-300">Основы PyTorch: Цикл обучения</h3>
            </div>
            
            <div className="text-slate-300 leading-loose text-lg space-y-6 font-serif">
              <p>
                При создании нейронной сети первым шагом является подготовка данных. Единичный элемент входных данных известен как <HighlightedTerm term="Feature" translation="Признак" code="X = data.features" />. Все входные данные конвертируются в <HighlightedTerm term="Tensor" translation="Тензор" code="t = torch.tensor(X)" />, который является фундаментальной структурой данных в PyTorch.
              </p>
              <p>
                Во время фазы <HighlightedTerm term="Training" translation="Обучения" code="model.train()" /> модель делает предсказания, и мы вычисляем ошибку, используя <HighlightedTerm term="Loss Function" translation="Функцию потерь" code="loss = criterion(pred, y)" />. Этот процесс повторяется. Один полный проход по всему тренировочному датасету называется <HighlightedTerm term="Epoch" translation="Эпохой" code="for epoch in range(10):" />.
              </p>
            </div>
          </GlassCard>
        </div>
      );
    };

    // 5. БИБЛИОТЕКА
    const Library = () => {
      const [search, setSearch] = useState("");

      const filteredWords = WORDS.filter(w => 
        w.term.toLowerCase().includes(search.toLowerCase()) || 
        w.translation.toLowerCase().includes(search.toLowerCase())
      );

      return (
        <div className="max-w-4xl mx-auto fade-in">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
            <h2 className="text-2xl font-bold text-white">Библиотека знаний</h2>
            <div className="relative w-full sm:w-64">
              <IconSearch className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" />
              <input 
                type="text" 
                placeholder="Поиск терминов..." 
                value={search}
                onChange={(e) => setSearch(e.target.value)}
                className="w-full bg-slate-800/50 border border-slate-700 text-white rounded-2xl py-2 pl-10 pr-4 focus:outline-none focus:border-blue-500 transition-colors"
              />
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {filteredWords.map(word => (
              <GlassCard key={word.id} className="p-5 flex flex-col hover:bg-slate-800/80 transition-colors">
                <div className="flex justify-between items-start mb-3">
                  <div>
                    <h4 className="text-xl font-bold text-white">{word.term}</h4>
                    <span className="text-sm text-purple-400">{word.translation}</span>
                  </div>
                  <span className="text-xs px-2 py-1 bg-slate-900 rounded-lg text-slate-400 border border-slate-700">
                    {word.category}
                  </span>
                </div>
                <p className="text-sm text-slate-400 mb-3">{word.context}</p>
                <code className="text-xs bg-slate-900 p-2 rounded-lg text-green-400 font-mono mt-auto">
                  {word.codeExample}
                </code>
              </GlassCard>
            ))}
            {filteredWords.length === 0 && (
              <div className="col-span-full text-center py-10 text-slate-500">
                Ничего не найдено по запросу «{search}»
              </div>
            )}
          </div>
        </div>
      );
    };

    // --- ГЛАВНЫЙ КОМПОНЕНТ ---
    const MLEnglishExplorer = () => {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

      const TABS = [
        { id: 'dashboard', label: 'Главная панель', icon: IconLayoutDashboard },
        { id: 'practice', label: 'Тренажёр', icon: IconBrainCircuit },
        { id: 'quiz', label: 'Анализ контекста', icon: IconTarget },
        { id: 'reading', label: 'Чтение', icon: IconFileText },
        { id: 'library', label: 'Словарь терминов', icon: IconLibrary },
      ];

      return (
        <div className="min-h-screen selection:bg-blue-500/30">
          {/* Боковое меню (Десктоп) */}
          <aside className="fixed hidden md:flex flex-col w-64 h-screen border-r border-slate-800 bg-slate-900/50 backdrop-blur-xl p-6 z-20">
            <div className="flex items-center gap-3 mb-10">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center shadow-lg shadow-purple-500/20">
                <IconBrainCircuit className="text-white w-6 h-6" />
              </div>
              <h1 className="font-bold text-xl text-white tracking-tight">ML Explorer</h1>
            </div>

            <nav className="flex flex-col gap-2 flex-1">
              {TABS.map((tab) => {
                const Icon = tab.icon;
                const isActive = activeTab === tab.id;
                return (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`flex items-center gap-3 px-4 py-3 rounded-2xl transition-all duration-300 font-medium ${
                      isActive 
                        ? 'bg-blue-500/10 text-blue-400 border border-blue-500/20 shadow-[inset_0_0_20px_rgba(59,130,246,0.05)]' 
                        : 'text-slate-400 hover:text-white hover:bg-slate-800/50'
                    }`}
                  >
                    <Icon className={`w-5 h-5 ${isActive ? 'text-blue-400' : 'text-slate-500'}`} />
                    {tab.label}
                  </button>
                )
              })}
            </nav>
          </aside>

          {/* Шапка и меню (Мобильные устройства) */}
          <div className="md:hidden fixed top-0 w-full z-30 bg-slate-900/80 backdrop-blur-md border-b border-slate-800">
            <div className="flex items-center justify-between p-4">
              <div className="flex items-center gap-2">
                <IconBrainCircuit className="text-blue-400 w-6 h-6" />
                <h1 className="font-bold text-lg text-white">ML Explorer</h1>
              </div>
              <button 
                onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)}
                className="text-slate-300 p-2 focus:outline-none"
              >
                {isMobileMenuOpen ? <IconX className="w-6 h-6" /> : <IconLayoutDashboard className="w-6 h-6" />}
              </button>
            </div>
            
            <div className={`overflow-hidden transition-all duration-300 ease-in-out ${isMobileMenuOpen ? 'max-h-64 border-b border-slate-800' : 'max-h-0'}`}>
              <div className="flex flex-col p-4 gap-2 bg-slate-900">
                {TABS.map((tab) => (
                  <button
                    key={tab.id}
                    onClick={() => { setActiveTab(tab.id); setIsMobileMenuOpen(false); }}
                    className={`flex items-center gap-3 px-4 py-3 rounded-xl transition-colors ${activeTab === tab.id ? 'bg-blue-500/10 text-blue-400' : 'text-slate-400'}`}
                  >
                    <tab.icon className="w-5 h-5" /> {tab.label}
                  </button>
                ))}
              </div>
            </div>
          </div>

          {/* Основная рабочая область */}
          <main className="md:ml-64 p-6 pt-24 md:pt-10 min-h-screen">
            <div className="max-w-6xl mx-auto">
              {activeTab === 'dashboard' && <Dashboard />}
              {activeTab === 'practice' && <PracticeZone />}
              {activeTab === 'quiz' && <ContextQuiz />}
              {activeTab === 'reading' && <ReadingZone />}
              {activeTab === 'library' && <Library />}
            </div>
          </main>
        </div>
      );
    };

    // Рендер приложения
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MLEnglishExplorer />);
  </script>
</body>
</html>
